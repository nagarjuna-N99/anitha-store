services:
  - type: web
    name: anitha-store-server
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node server.mjs
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: shop-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://nagarjuna-n99.github.io
      - key: SITE_URL
        value: https://nagarjuna-n99.github.io/anitha-store
      - key: ANTHROPIC_API_KEY
        sync: false
