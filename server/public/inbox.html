<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop inbox</title>
<style>
:root{--ink:#1f2933;--line:#e5e0d8;--gold:#a67c52}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:#faf8f4;color:var(--ink)}
.wrap{max-width:900px;margin:0 auto;padding:14px}h1{font-size:20px;margin:6px 0 2px}.sub{color:#777;font-size:13px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.tabs button{padding:9px 16px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:14px}.tabs button.on{background:#1f2933;color:#fff}
.n{background:#d33;color:#fff;border-radius:9px;padding:0 7px;font-size:11px;margin-left:5px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}.card h3{margin:0 0 4px;font-size:16px}.muted{color:#888;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px}.btn.p{background:#1f2933;color:#fff;border-color:#1f2933}.btn.g{background:#075e54;color:#fff;border-color:#075e54}
.log{background:#efeae2;border-radius:8px;padding:8px;max-height:260px;overflow:auto;margin-top:8px;display:flex;flex-direction:column;gap:4px}
.m{max-width:85%;padding:6px 10px;border-radius:8px;white-space:pre-wrap;font-size:14px}.in{background:#fff;align-self:flex-start}.out{background:#d9fdd3;align-self:flex-end}.owner{background:#c9e7ff;align-self:flex-end}.error{background:#fdd;align-self:center;font-size:12px}
textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-top:8px}.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;background:#eee}.pill.h{background:#fde2c8}.pill.b{background:#dcefdc}
#gate{max-width:360px;margin:60px auto;background:#fff;padding:26px;border-radius:12px;border:1px solid var(--line)}#gate input{width:100%;padding:11px;margin:10px 0;border:1px solid var(--line);border-radius:8px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
</style></head><body><div id="gate"><h3 style="margin-top:0">Shop inbox</h3><input id="tok" type="password" placeholder="Admin token"><button class="btn p" id="go" style="width:100%">Open</button><div id="gerr" style="color:#b00;font-size:13px;margin-top:8px"></div></div>
<div class="wrap" id="app" style="display:none"><h1>WhatsApp assistant inbox</h1><div class="sub" id="status"></div>
<div class="tabs" id="tabs"></div><div id="view"></div></div>
<script>
const $=id=>document.getElementById(id);let csrfTok='',tok=sessionStorage.getItem('wa_tok')||'',data=null,carts=null,tab='need',timer=null;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const fmt=ts=>ts?new Date(ts).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'';
const rs=n=>'₹'+Number(n).toLocaleString('en-IN');
async function call(p,body){const r=await fetch(p,{method:body?'POST':'GET',headers:{...(tok==='session'?{'X-CSRF-Token':csrfTok}:{Authorization:'Bearer '+tok}),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(r.status===401)throw new Error('Wrong admin token');const j=await r.json();if(!r.ok)throw new Error(j.error||'Failed');return j}
async function load(){try{data=await call('/api/inbox');carts=await call('/api/carts');const s=await call('/api/status');$('status').textContent=`${s.whatsapp==='live'?'🟢 WhatsApp live':'🟡 Dry-run (not sending to WhatsApp)'} · model ${s.model} · ${s.callsToday}/${s.maxCallsPerDay} assistant calls today · catalogue: ${s.catalogue?s.catalogue.products+' sarees':'NOT uploaded yet'}`;draw()}catch(e){if(!data){$('gerr').textContent=e.message;return}alert(e.message)}}
function chatBox(c){const box=el('div','card');const h=el('h3',null,(c.name||'Customer')+' · +'+c.phone);box.appendChild(h);box.appendChild(Object.assign(el('span','pill '+(c.status==='human'?'h':'b'),c.status==='human'?'You are handling':'Assistant handling'),{}));if(c.optedOut)box.appendChild(el('span','pill',' sent STOP'));box.appendChild(el('div','muted','Last message '+fmt(c.lastInboundAt)));
 const log=el('div','log');c.log.forEach(m=>log.appendChild(el('div','m '+m.dir,m.text)));box.appendChild(log);setTimeout(()=>log.scrollTop=1e9);
 const ta=el('textarea');ta.rows=2;ta.placeholder='Write a reply (the assistant stops answering this chat once you reply)';box.appendChild(ta);
 const row=el('div','row');const sug=el('button','btn','✨ Suggest a reply');sug.onclick=async()=>{sug.disabled=true;sug.textContent='Thinking…';try{const r=await call('/api/ai/reply',{phone:c.phone});ta.value=r.text||'';ta.focus()}catch(e){alert(e.message)}sug.disabled=false;sug.textContent='✨ Suggest a reply'};row.appendChild(sug);const send=el('button','btn g','Send reply');send.onclick=async()=>{if(!ta.value.trim())return;send.disabled=true;try{await call('/api/inbox/reply',{phone:c.phone,text:ta.value});ta.value='';await load()}catch(e){alert(e.message)}send.disabled=false};row.appendChild(send);
 if(c.status==='human'){const r=el('button','btn','Give back to assistant');r.onclick=async()=>{await call('/api/inbox/resume',{phone:c.phone});load()};row.appendChild(r)}box.appendChild(row);return box}
function draw(){const open=data.handoffs.filter(h=>h.status==='open'),newO=data.orders.filter(o=>o.status==='new');
 const tabs=[['need','Needs you',open.length],['orders','Orders',newO.length],['carts','Carts',0],['chats','All chats',0]];$('tabs').innerHTML='';tabs.forEach(([k,l,n])=>{const b=el('button',tab===k?'on':'',l);if(n)b.appendChild(el('span','n',n));b.onclick=()=>{tab=k;draw()};$('tabs').appendChild(b)});
 const v=$('view');v.innerHTML='';
 if(tab==='need'){if(!open.length)v.appendChild(el('p','muted','Nothing waiting. 🎉'));open.forEach(h=>{const c=data.conversations.find(x=>x.phone===h.phone);const card=el('div','card');card.appendChild(el('h3',null,(h.name||'Customer')+' · +'+h.phone));card.appendChild(el('div','muted',fmt(h.createdAt)+' · '+h.reason));card.appendChild(el('p',null,h.summary));const row=el('div','row');const done=el('button','btn p','Mark done');done.onclick=async()=>{await call('/api/inbox/handoff-close',{id:h.id});load()};row.appendChild(done);const wa=el('a','btn g','Open in WhatsApp');wa.href='https://wa.me/'+h.phone;wa.target='_blank';wa.rel='noopener';row.appendChild(wa);card.appendChild(row);v.appendChild(card);if(c)v.appendChild(chatBox(c))})}
 if(tab==='orders'){if(!data.orders.length)v.appendChild(el('p','muted','No order requests yet.'));data.orders.forEach(o=>{const card=el('div','card');card.appendChild(el('h3',null,o.id+' · '+rs(o.total)));card.appendChild(el('span','pill '+(o.status==='new'?'h':'b'),o.status));card.appendChild(el('div','muted',fmt(o.createdAt)+' · '+o.customerName+' · +'+o.phone+(o.contactPhone?' / '+o.contactPhone:'')));
  const t=el('table');o.items.forEach(i=>{const r=el('tr');[i.name+(i.sku?' ('+i.sku+')':''),'× '+i.quantity,rs(i.price*i.quantity)].forEach(x=>r.appendChild(el('td',null,x)));t.appendChild(r)});card.appendChild(t);if(o.coupon)card.appendChild(el('div','muted','Discount code '+o.coupon.code+': −'+rs(o.coupon.amount)));if(o.gift)card.appendChild(el('div','muted','🎁 Gift: '+[o.gift.wrap?'gift wrap (+'+rs(o.gift.fee)+')':'',o.gift.note?'note card: “'+o.gift.note+'”':'',o.gift.hideSender?'HIDE SENDER (no name/prices/invoice in parcel)':''].filter(Boolean).join(' · ')));if(o.shipTo&&o.shipTo.name!==o.customerName)card.appendChild(el('div','muted','Deliver to: '+o.shipTo.name+(o.shipTo.phone?' · +'+o.shipTo.phone:'')));if(o.addressCheck&&o.addressCheck.status&&o.addressCheck.status!=='ok')card.appendChild(el('div','muted','⚠ Address check ('+o.addressCheck.status+'): the PIN/city/state looked doubtful or outside your usual areas. The customer confirmed it. Please double-check before dispatch.'));if(o.addressChangedAfterPacked)card.appendChild(el('div','muted','⚠ Address changed AFTER packing: relabel the parcel.'));if(o.addressHistory&&o.addressHistory.length)card.appendChild(el('div','muted','Address changed '+o.addressHistory.length+'× by the customer'));if(o.invoice)card.appendChild(el('div','muted','Invoice '+o.invoice.number+' sent'));card.appendChild(el('p',null,o.address+' - '+o.pincode+(o.note?'\nNote: '+o.note:'')));
  if(o.payment&&o.payment.url)card.appendChild(el('div','muted','Payment link: '+o.payment.url+(o.status==='payment_pending'?' · valid until '+fmt(o.payment.expiresAt):'')));if(o.issue)card.appendChild(el('p',null,'⚠ '+o.issue));
  const row=el('div','row');const act=(label,cls,fn)=>{const b=el('button','btn '+cls,label);b.onclick=async()=>{b.disabled=true;try{await fn();await load()}catch(e){alert(e.message)}b.disabled=false};row.appendChild(b)};
  if(o.status==='new')act('Send payment link','g',()=>call('/api/orders/send-link',{id:o.id}));
  if(o.status==='payment_pending'){act('Resend link','',()=>call('/api/orders/send-link',{id:o.id,resend:true}));act('Mark paid manually','',async()=>{const r=prompt('Payment reference (optional)','');if(r===null)return;await call('/api/orders/paid-manual',{id:o.id,reference:r})})}
  const ship=async(to)=>{let tracking='',trackingUrl='';if(to==='shipped'){const t=prompt('Courier name / tracking number to send the customer (optional)','');if(t===null)return;tracking=t;const u=prompt('Courier tracking link (optional, https://…)','');if(u===null)return;trackingUrl=u}await call('/api/orders/status',{id:o.id,status:to,tracking,trackingUrl})};
  if(o.status==='paid'){act('Mark packed','p',()=>ship('packed'));act('Mark shipped','',()=>ship('shipped'))}
  if(o.status==='packed')act('Mark shipped','p',()=>ship('shipped'));
  if(o.status==='shipped'){act('Out for delivery','p',()=>ship('out_for_delivery'));act('Delivered','',()=>ship('delivered'))}
  if(o.status==='out_for_delivery')act('Delivered','p',()=>ship('delivered'));
  if(['paid','packed','shipped','out_for_delivery','delivered'].includes(o.status))act('🖨 Packing slip','',async()=>{const r=await fetch('/api/orders/slip?id='+encodeURIComponent(o.id),{headers:{...(tok==='session'?{'X-CSRF-Token':csrfTok}:{Authorization:'Bearer '+tok})}});const url=URL.createObjectURL(new Blob([await r.text()],{type:'text/html'}));window.open(url,'_blank')});
  if(['new','payment_pending'].includes(o.status))act('Release unpaid order','',()=>{if(!confirm('Release this UNPAID order and put the saree back on sale? (Customers cannot cancel; this is your decision.)'))return Promise.resolve();return call('/api/orders/cancel',{id:o.id})});
  const w=el('a','btn','Message customer');w.href='https://wa.me/'+(o.contactPhone||o.phone).replace(/\D/g,'');w.target='_blank';w.rel='noopener';row.appendChild(w);card.appendChild(row);v.appendChild(card)})}

 if(tab==='carts'&&carts){const top=el('div','card');top.appendChild(el('h3',null,'Cart reminders '+(carts.enabled?'(on)':'(paused)')));top.appendChild(el('div','muted',`Sent after ${carts.delaysMin[0]} min of inactivity, second reminder ${Math.round(carts.delaysMin[1]/60)} h later. Max 2. Only for customers who agreed. Never 9 pm–9 am IST.`));
  const t=el('table');[['Waiting (agreed)',carts.waiting],['Reminders sent',carts.remindersSent],['Failed to send',carts.failed],['Orders recovered',carts.recovered]].forEach(([a,b])=>{const r=el('tr');r.appendChild(el('td',null,a));r.appendChild(el('td',null,String(b)));t.appendChild(r)});top.appendChild(t);
  const row=el('div','row');const tg=el('button','btn'+(carts.enabled?'':' p'),carts.enabled?'Pause reminders':'Resume reminders');tg.onclick=async()=>{await call('/api/cart/settings',{enabled:!carts.enabled});load()};row.appendChild(tg);const run=el('button','btn','Check now');run.onclick=async()=>{const r=await call('/api/carts/run',{});alert((r.done||[]).length+' reminder(s) sent');load()};row.appendChild(run);top.appendChild(row);v.appendChild(top);
  carts.list.forEach(c=>{const card=el('div','card');card.appendChild(el('h3',null,(c.name||'Customer')+' · +'+c.phone));card.appendChild(el('span','pill '+(c.consent?'b':'h'),c.consent?'agreed to reminders':'no consent - never reminded'));if(c.ordered)card.appendChild(el('span','pill b',c.ordered.recovered?' ordered after reminder ✓':' ordered'));card.appendChild(el('div','muted','Cart changed '+fmt(c.updatedAt)));
   c.items.forEach(i=>card.appendChild(el('div',null,`${i.name} × ${i.qty} · ${rs(i.price*i.qty)}${i.stock<=0?' (sold out)':''}`)));
   if(c.reminders.length)card.appendChild(el('div','muted','Reminders: '+c.reminders.map(r=>`#${r.n} ${r.status} ${fmt(r.at)}`).join(' · ')));v.appendChild(card)});if(!carts.list.length)v.appendChild(el('p','muted','No carts yet.'))}
 if(tab==='chats'){if(!data.conversations.length)v.appendChild(el('p','muted','No chats yet.'));data.conversations.forEach(c=>v.appendChild(chatBox(c)))}}
$('go').onclick=async()=>{tok=$('tok').value;await load();if(data){sessionStorage.setItem('wa_tok',tok);$('gate').style.display='none';$('app').style.display='block';timer=setInterval(()=>{if(!document.hidden&&!document.activeElement?.matches('textarea'))load()},20000)}};
$('tok').onkeydown=e=>{if(e.key==='Enter')$('go').click()};if(tok){$('tok').value=tok;$('go').click()}

(async()=>{try{const s=await (await fetch('/admin/api/state')).json();if(s.signedIn){csrfTok=s.csrf;$('tok').value='session';$('go').click()}}catch(e){}})();
</script></body></html>
